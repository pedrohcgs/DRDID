# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      # `containers` is filtered to drop rchk and valgrind -- see the step below.
      containers: ${{ steps.drop-noisy.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup
    # --- local customization: never run rchk or valgrind ---------------------
    # Both produce perpetual false positives on this package that are NOT in our own
    # code, so the run-check step always fails on them with no real signal:
    #   * rchk     -- cannot analyze Rcpp's Shield/Armor protection templates
    #                 ("unsupported form of unprotect"); findings are in Rcpp's headers.
    #   * valgrind -- reports OpenMP thread-local storage (libgomp / GOMP_parallel,
    #                 via data.table's parallel sort) as "possibly lost"; "definitely
    #                 lost" is 0, and clang-asan / gcc-asan already cover real memory
    #                 errors in our compiled code.
    # We drop both from the container matrix here so they never run, even if passed in
    # the dispatch `config`. To restore the upstream default, delete this step and
    # point `outputs.containers` back to `steps.rhub-setup.outputs.containers` (or
    # re-run `rhub::rhub_setup(overwrite = TRUE)`).
    - name: Drop rchk and valgrind from the container matrix
      id: drop-noisy
      env:
        CONTAINERS: ${{ steps.rhub-setup.outputs.containers }}
      run: |
        filtered=$(printf '%s' "$CONTAINERS" | jq -c '[.[] | (((.label // "") + " " + (.container // "")) | ascii_downcase) as $s | select((($s | contains("rchk")) or ($s | contains("valgrind"))) | not)]')
        echo "containers=$filtered" >> "$GITHUB_OUTPUT"

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
